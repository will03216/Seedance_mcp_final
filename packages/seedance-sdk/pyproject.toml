[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seedance-sdk"
version = "2.0.0"
description = "Python SDK for BytePlus Seedance 2.0 video generation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["byteplus", "seedance", "video-generation", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
# Zero runtime dependencies — uses stdlib urllib only
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-httpserver>=1.0.0",
    "mypy>=1.8.0",
    "ruff>=0.3.0",
]

[project.urls]
Repository = "https://github.com/byteplus/byteplus-seedance"
Documentation = "https://docs.byteplus.com/en/docs/ModelArk/2291680"

[tool.hatch.build.targets.wheel]
packages = ["seedance"]
