[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seedance-cli"
version = "2.0.0"
description = "CLI for BytePlus Seedance 2.0 video generation"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["byteplus", "seedance", "cli", "video-generation", "ai"]
dependencies = [
    "seedance-sdk>=2.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
mcp = ["seedance-mcp>=2.0.0"]   # install CLI + MCP server together
dev = [
    "pytest>=8.0.0",
    "mypy>=1.8.0",
    "ruff>=0.3.0",
]

[project.scripts]
seedance = "seedance_cli.main:app"

[project.urls]
Repository = "https://github.com/byteplus/byteplus-seedance"

[tool.hatch.build.targets.wheel]
packages = ["seedance_cli"]
